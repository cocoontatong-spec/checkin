<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบลงเวลาสแกนหน้าอัตโนมัติ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
  :root{--bg:#f2f4f8;--card:#fff;--ink:#1b2232;--muted:#677086;--line:#e2e6ee;--brand:#1f6feb;--brand2:#0b4fc4;
        --ok:#17924f;--okbg:#e5f6ec;--warn:#b76e00;--warnbg:#fff4df;--bad:#c62f4a;--badbg:#fde8ec;--ot:#7928ca;--otbg:#f3e8ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,-apple-system,sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:14px 16px 40px}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 0 12px}
  header h1{font-size:20px;margin:0;line-height:1.2}
  header small{color:var(--muted);font-size:13px}
  .clock{text-align:right}
  .clock .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .clock .d{font-size:13px;color:var(--muted)}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(20,30,60,.07);margin-bottom:12px}
  button,.btn{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:12px;padding:14px;width:100%;cursor:pointer;background:var(--brand);color:#fff;display:block;text-align:center}
  button:active{background:var(--brand2)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .ghost{background:#eef1f7;color:var(--ink)}
  .mt{margin-top:10px}
  .cam{position:relative;border-radius:14px;overflow:hidden;background:#0d1220;aspect-ratio:3/4}
  .cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .guide{position:absolute;left:50%;top:46%;width:62%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:3px dashed rgba(255,255,255,.55);border-radius:50%;pointer-events:none}
  .guide.ok{border-style:solid;border-color:#3ddc84}
  .camMsg{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:15px;text-align:center}
  .chips{display:flex;gap:8px;margin:12px 0}
  .chip{flex:1;font-size:13px;padding:8px 10px;border-radius:10px;background:#eef1f7;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
  .chip i{width:9px;height:9px;border-radius:50%;background:#a7afbf;flex:none}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.ok i{background:var(--ok)}
  .chip.bad{background:var(--badbg);color:var(--bad)} .chip.bad i{background:var(--bad)}
  .alert{border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:12px;line-height:1.5}
  .alert.bad{background:var(--badbg);color:var(--bad)} .alert.info{background:#e7f0ff;color:var(--brand2)}
  .empHeader{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .avatar{width:48px;height:48px;border-radius:50%;background:#dfe8fb;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:20px}
  .empHeader b{font-size:18px;display:block} .empHeader span{color:var(--muted);font-size:14px}
  .choiceTitle{font-weight:700;color:var(--brand);text-align:center;margin:10px 0 12px;font-size:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .opt{background:#eef1f7;color:var(--ink);border:2px solid transparent;padding:14px 6px;font-size:16px;font-weight:600;border-radius:10px}
  .opt.ot{background:var(--otbg);color:var(--ot)}
  .res{text-align:center}
  .res .ic{width:68px;height:68px;border-radius:50%;margin:4px auto 10px;display:grid;place-items:center;font-size:36px;color:#fff;background:var(--ok)}
  .res .big{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
  .res img{width:110px;height:146px;object-fit:cover;border-radius:10px;margin:10px auto;display:block}
  .kv{text-align:left;margin-top:10px;font-size:14px}
  .kv div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:13px;font-weight:600}
  .tag.ok{background:var(--okbg);color:var(--ok)} .tag.warn{background:var(--warnbg);color:var(--warn)}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>ลงเวลาเข้างาน</h1><small>มองกล้อง สแกนจับคู่อัตโนมัติ</small></div>
    <div class="clock"><div class="t" id="clk">--:--:--</div><div class="d" id="clkd"></div></div>
  </header>

  <div id="alert" class="alert bad" hidden></div>

  <!-- ขั้นที่ 1: กล้องสแกนหน้าอัตโนมัติ -->
  <section class="card" id="stepScan">
    <div class="cam">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div class="guide" id="guide"></div>
      <div class="camMsg" id="camMsg">กำลังเปิดกล้อง...</div>
    </div>
    <div class="chips">
      <div class="chip" id="chipFace"><i></i><span>ใบหน้า: ส่องตรงกล้อง</span></div>
      <div class="chip" id="chipGps"><i></i><span>GPS: กำลังหา...</span></div>
    </div>
    <button class="ghost mt" id="btnManualReg">พนักงานใหม่? ลงทะเบียนใบหน้า</button>
  </section>

  <!-- ขั้นที่ 2: พบพนักงานแล้ว เลือกรายการ -->
  <section class="card" id="stepChoice" hidden>
    <div class="empHeader">
      <div class="avatar" id="av"></div>
      <div><b id="empName"></b><span id="empDept"></span></div>
    </div>
    <div class="choiceTitle">✓ ยืนยันตัวตนสำเร็จ กรุณาเลือกรายการ</div>
    <div class="grid2">
      <button class="opt" data-type="IN">🟢 เข้างาน</button>
      <button class="opt" data-type="OUT">🔴 ออกงาน</button>
    </div>
    <div class="grid2">
      <button class="opt ot" data-type="OT_IN">⏱️ เริ่มโอที</button>
      <button class="opt ot" data-type="OT_OUT">🏁 จบโอที</button>
    </div>
    <div class="grid3">
      <button class="opt" data-type="LEAVE_SICK">🤒 ลาป่วย</button>
      <button class="opt" data-type="LEAVE_BIZ">📋 ลากิจ</button>
      <button class="opt" data-type="LEAVE_VAC">🏖️ พักร้อน</button>
    </div>
    <button class="ghost mt" id="btnCancel">ยกเลิก / ไม่ใช่ฉัน</button>
  </section>

  <!-- ขั้นที่ 3: ลงทะเบียนพนักงานใหม่ (กรณีหาหน้าไม่เจอ) -->
  <section class="card" id="stepReg" hidden>
    <label for="regId">รหัสพนักงานใหม่ (เช่น EMP005)</label>
    <input type="text" id="regId" style="width:100%;font-size:20px;padding:10px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;text-transform:uppercase">
    <button id="btnStartReg">บันทึกใบหน้านี้</button>
    <button class="ghost mt" id="btnBackScan">กลับหน้าสแกน</button>
  </section>

  <!-- ขั้นที่ 4: สรุปผลสำเร็จ -->
  <section class="card res" id="stepRes" hidden>
    <div class="ic">✓</div>
    <h2 id="rTitle"></h2>
    <div id="rName"></div>
    <div class="big" id="rTime"></div>
    <img id="rImg" alt="">
    <div class="kv" id="rKv"></div>
    <button class="mt" id="btnNextEmp">เสร็จสิ้น (รอคนถัดไป)</button>
  </section>
</div>

<script>
const BUILD = '2026-11-09.5';
const API_URL = 'https://script.google.com/macros/s/AKfycbzcA_B-loUQQTfAOSpeczHp3x4Agp6AhG4PlUX_Od5Ri1cFpseCfpHQn_Kttlu0Zdt-vA/exec';
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const $ = id => document.getElementById(id);
const S = { emp:null, stream:null, pos:null, busy:false, loop:false, models:false, scanData:null, timer:null };

function tick(){
  const d = new Date();
  $('clk').textContent = d.toLocaleTimeString('th-TH', {hour12:false, timeZone:'Asia/Bangkok'});
  $('clkd').textContent = d.toLocaleDateString('th-TH', {weekday:'short', day:'numeric', month:'short', year:'numeric', timeZone:'Asia/Bangkok'});
}
tick(); setInterval(tick, 1000);

function api(fn, arg){
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, arg: arg }) })
    .then(r => r.json())
    .then(r => { if (r && r.ok === false) throw new Error(r.msg); return r; });
}

function showErr(msg){ const a=$('alert'); a.textContent = String(msg && msg.message || msg); a.hidden=false; }
function hideErr(){ $('alert').hidden = true; }
function show(id){ ['stepScan','stepChoice','stepReg','stepRes'].forEach(s => $(s).hidden = s !== id); }

/* โหลดโมเดล & เริ่มกล้องทันที */
(async () => {
  try {
    startGps();
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
    ]);
    S.models = true;
    startCamera();
  } catch(e) { showErr('โหลดระบบไม่สำเร็จ กรุณารีเฟรช'); }
})();

async function startCamera(){
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480} } });
    const v = $('video'); v.srcObject = S.stream; await v.play();
    S.loop = true;
    detectLoop();
  } catch(e) { showErr('เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง'); }
}

async function detectLoop(){
  if (!S.loop) return;
  const v = $('video');
  if (S.models && v.readyState >= 2 && !S.busy && $('stepScan').hidden === false) {
    try {
      const det = await faceapi.detectSingleFace(v, new faceapi.TinyFaceDetectorOptions({inputSize:224, scoreThreshold:0.5})).withFaceLandmarks();
      const c = $('overlay');
      if (c.width !== v.videoWidth) { c.width = v.videoWidth; c.height = v.videoHeight; }
      const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);

      if (det) {
        const b = det.detection.box, near = b.width / Math.min(v.videoWidth, v.videoHeight) > 0.28;
        ctx.lineWidth = 3; ctx.strokeStyle = near ? '#3ddc84' : '#ffcc00';
        ctx.strokeRect(b.x, b.y, b.width, b.height);
        $('guide').classList.toggle('ok', near);

        if (near) {
          S.stable = (S.stable || 0) + 1;
          if (S.stable >= 4) {
            S.stable = 0;
            identify(v, det.detection.box);
          } else {
            $('camMsg').textContent = 'กำลังจับคู่ใบหน้า...';
          }
        } else {
          S.stable = 0;
          $('camMsg').textContent = 'ขยับหน้าเข้าใกล้กล้องอีกนิด';
        }
      } else {
        S.stable = 0;
        $('camMsg').textContent = 'มองตรงกล้องเพื่อสแกน';
        $('guide').classList.remove('ok');
      }
    } catch(e){}
  }
  setTimeout(detectLoop, 150);
}

function startGps(){
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p => {
    S.pos = { lat:p.coords.latitude, lng:p.coords.longitude, accuracy:p.coords.accuracy };
    $('chipGps').className = 'chip ok';
    $('chipGps').querySelector('span').textContent = 'GPS: พร้อม';
  }, err => {}, { enableHighAccuracy:true });
}

/* ระบุตัวตนอัตโนมัติ */
async function identify(src, box){
  if (S.busy) return;
  S.busy = true;
  hideErr();
  $('camMsg').innerHTML = '<span class="spin"></span>กำลังค้นหารหัสพนักงาน...';
  try {
    const frame = frameOf(src);
    const r = await faceapi.detectSingleFace(frame, new faceapi.TinyFaceDetectorOptions({inputSize:416})).withFaceLandmarks().withFaceDescriptor();
    if (!r) throw new Error('ไม่พบใบหน้าชัดเจน');

    const desc = Array.from(r.descriptor);
    const emp = await api('identifyFace', desc);

    S.emp = emp;
    S.scanData = { desc: desc, frame: frame, box: box, photo: makePhoto(frame, box, 'ยืนยันตัวตน') };

    /* แสดงหน้าเลือกรายการ */
    $('av').textContent = emp.name.charAt(0);
    $('empName').textContent = emp.name;
    $('empDept').textContent = `${emp.id} · ${emp.dept || ''}`;
    show('stepChoice');
  } catch(e) {
    showErr(e.message || 'ไม่พบใบหน้าตรงกับในระบบ');
    setTimeout(() => { hideErr(); $('camMsg').textContent = 'มองตรงกล้องเพื่อสแกน'; }, 3000);
  } finally {
    S.busy = false;
  }
}

/* เลือกประเภทรายการ */
document.querySelectorAll('.opt').forEach(b => b.onclick = () => submitCheckIn(b.dataset.type));

async function submitCheckIn(type){
  if (S.busy || !S.emp) return;
  if (!S.pos) return showErr('ยังไม่ได้รับพิกัด GPS');
  S.busy = true;
  hideErr();
  try {
    const r = await api('checkIn', {
      empId: S.emp.id,
      type: type,
      descriptor: S.scanData.desc,
      photo: S.scanData.photo,
      lat: S.pos.lat,
      lng: S.pos.lng,
      accuracy: S.pos.accuracy,
      ua: navigator.userAgent
    });

    /* แสดงผลลัพธ์ */
    $('rTitle').textContent = 'บันทึก' + r.typeTh + 'สำเร็จ';
    $('rName').textContent = r.name;
    $('rTime').textContent = r.time + ' น.';
    $('rImg').src = S.scanData.photo;
    $('rKv').innerHTML = `
      <div><span>สถานะ</span><span class="tag ok">${r.status}</span></div>
      <div><span>สถานที่</span><span>${r.address || r.place}</span></div>
      <div><span>ความตรงของใบหน้า</span><span>${r.faceScore}%</span></div>
    `;
    show('stepRes');

    /* นับถอยหลัง 6 วินาที วนกลับหน้าสแกนรอคนถัดไปอัตโนมัติ */
    let sec = 6;
    $('btnNextEmp').textContent = `เสร็จสิ้น (${sec} วิ)`;
    clearInterval(S.timer);
    S.timer = setInterval(() => {
      sec--;
      if (sec <= 0) resetToScan();
      else $('btnNextEmp').textContent = `เสร็จสิ้น (${sec} วิ)`;
    }, 1000);

  } catch(e) {
    showErr(e);
  } finally {
    S.busy = false;
  }
}

function resetToScan(){
  clearInterval(S.timer);
  S.emp = null;
  S.scanData = null;
  hideErr();
  show('stepScan');
  $('btnNextEmp').textContent = 'เสร็จสิ้น (รอคนถัดไป)';
}
$('btnNextEmp').onclick = resetToScan;
$('btnCancel').onclick = resetToScan;

/* พนักงานใหม่ */
$('btnManualReg').onclick = () => { show('stepReg'); };
$('btnBackScan').onclick = resetToScan;
$('btnStartReg').onclick = async () => {
  const empId = $('regId').value.trim().toUpperCase();
  if (!empId) return showErr('กรุณากรอกรหัสพนักงาน');
  showErr('กำลังบันทึกใบหน้า กรุณามองตรงกล้อง...');
  try {
    const v = $('video');
    const frame = frameOf(v);
    const r = await faceapi.detectSingleFace(frame, new faceapi.TinyFaceDetectorOptions({inputSize:416})).withFaceLandmarks().withFaceDescriptor();
    if (!r) throw new Error('ไม่พบใบหน้า กรุณามองกล้องในที่สว่าง');
    const photo = makePhoto(frame, r.detection.box, 'ลงทะเบียน');
    await api('registerFace', { empId: empId, descriptor: Array.from(r.descriptor), photo: photo });
    alert('ลงทะเบียนใบหน้าสำเร็จ! สามารถสแกนเพื่อลงเวลาได้ทันที');
    resetToScan();
  } catch(e) { showErr(e); }
};

function frameOf(src){
  const c = document.createElement('canvas');
  c.width = src.videoWidth || 640; c.height = src.videoHeight || 480;
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

function makePhoto(frame, box, label){
  const W = 360, H = 480;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.drawImage(frame, 0, 0, W, H);
  x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, H - 50, W, 50);
  x.fillStyle = '#fff'; x.font = '600 15px Sarabun';
  x.fillText(new Date().toLocaleTimeString('th-TH') + ' ' + label, 10, H - 18);
  return c.toDataURL('image/jpeg', 0.8);
}
</script>
</body>
</html>
